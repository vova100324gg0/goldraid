name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Кэш Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform
          key: android-platform-api33-ndk28c-v2

      - name: Кэш pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Собрать APK
        run: buildozer -v android debug

      - name: Найти APK
        id: apk
        run: |
          file=$(ls bin/*.apk | head -n 1)
          echo "filename=$file" >> "$GITHUB_OUTPUT"
          ls -lh "$file"

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: goldraid-apk
          path: ${{ steps.apk.outputs.filename }}
          if-no-files-found: error
          retention-days: 30

      - name: Приложить APK к публичному релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: vova100324gg0/goldraid-downloads
          token: ${{ secrets.RELEASE_TOKEN }}
          name: "Золотой рейд ${{ github.ref_name }}"
          body: |
            **Золотой рейд ${{ github.ref_name }}**

            Android: APK · Windows: ZIP.

            Что нового в 1.8.0:
            - постройки качаются до 5 уровня — поздние волны больше не стена;
            - больше общих улучшений: оружие, броня и стены;
            - баланс-патч: Кратер, Руины и Цитадель мягче, финальные волны — по силам;
            - первые карты стали чуть сложнее — интереснее с самого начала;
            - Руины: дороги стали извилистее — башни дольше держат врагов под огнём;
            - наём бойцов ограничен шестью за бой, остаток виден на кнопке;
            - портреты героев в катсценах: Рейн, Старейшина, Мира, Гракх и Владыка Мор;
            - оптимизация боя: орды врагов и отряды не тормозят кадр.
          make_latest: true
          files: ${{ steps.apk.outputs.filename }}

      - name: Приложить APK к релизу в репозитории кода
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Золотой рейд ${{ github.ref_name }}"
          body: |
            **Золотой рейд ${{ github.ref_name }}**

            Android: APK · Windows: ZIP.

            Что нового в 1.8.0:
            - постройки качаются до 5 уровня — поздние волны больше не стена;
            - больше общих улучшений: оружие, броня и стены;
            - баланс-патч: Кратер, Руины и Цитадель мягче, финальные волны — по силам;
            - первые карты стали чуть сложнее — интереснее с самого начала;
            - Руины: дороги стали извилистее — башни дольше держат врагов под огнём;
            - наём бойцов ограничен шестью за бой, остаток виден на кнопке;
            - портреты героев в катсценах: Рейн, Старейшина, Мира, Гракх и Владыка Мор;
            - оптимизация боя: орды врагов и отряды не тормозят кадр.
          make_latest: true
          files: ${{ steps.apk.outputs.filename }}

  windows:
    name: Build Windows build
    runs-on: windows-latest
    needs: apk
    timeout-minutes: 180

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Собрать Windows-версию
        env:
          # PyInstaller при анализе импортирует kivy.core.window, а Kivy создаёт
          # окно. На раннере без видеокарты драйвер отдаёт OpenGL 1.1, Kivy
          # показывает модальное окно «Minimum required OpenGL version (2.0)
          # NOT found» и ждёт нажатия кнопки — сборка висит до таймаута.
          # Mock-бэкенд убирает проверку GL и это окно.
          KIVY_GL_BACKEND: mock
        run: powershell -ExecutionPolicy Bypass -File build_windows.ps1 -Version 1.8.0 -NoVenv

      - name: Загрузить архив как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: goldraid-windows
          path: build/windows/goldraid-1.8.0-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Приложить архив к публичному релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: vova100324gg0/goldraid-downloads
          token: ${{ secrets.RELEASE_TOKEN }}
          name: "Золотой рейд ${{ github.ref_name }}"
          body: |
            **Золотой рейд ${{ github.ref_name }}**

            Android: APK · Windows: ZIP.

            Что нового в 1.8.0:
            - постройки качаются до 5 уровня — поздние волны больше не стена;
            - больше общих улучшений: оружие, броня и стены;
            - баланс-патч: Кратер, Руины и Цитадель мягче, финальные волны — по силам;
            - первые карты стали чуть сложнее — интереснее с самого начала;
            - Руины: дороги стали извилистее — башни дольше держат врагов под огнём;
            - наём бойцов ограничен шестью за бой, остаток виден на кнопке;
            - портреты героев в катсценах: Рейн, Старейшина, Мира, Гракх и Владыка Мор;
            - оптимизация боя: орды врагов и отряды не тормозят кадр.
          make_latest: true
          files: build/windows/goldraid-1.8.0-windows.zip

      - name: Приложить архив к релизу в репозитории кода
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Золотой рейд ${{ github.ref_name }}"
          body: |
            **Золотой рейд ${{ github.ref_name }}**

            Android: APK · Windows: ZIP.

            Что нового в 1.8.0:
            - постройки качаются до 5 уровня — поздние волны больше не стена;
            - больше общих улучшений: оружие, броня и стены;
            - баланс-патч: Кратер, Руины и Цитадель мягче, финальные волны — по силам;
            - первые карты стали чуть сложнее — интереснее с самого начала;
            - Руины: дороги стали извилистее — башни дольше держат врагов под огнём;
            - наём бойцов ограничен шестью за бой, остаток виден на кнопке;
            - портреты героев в катсценах: Рейн, Старейшина, Мира, Гракх и Владыка Мор;
            - оптимизация боя: орды врагов и отряды не тормозят кадр.
          make_latest: true
          files: build/windows/goldraid-1.8.0-windows.zip