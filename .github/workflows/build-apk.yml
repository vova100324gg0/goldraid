name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Кэш Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform
          key: android-platform-api33-ndk28c-v2

      - name: Кэш pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Собрать APK
        run: buildozer -v android debug

      - name: Найти APK
        id: apk
        run: |
          file=$(ls bin/*.apk | head -n 1)
          echo "filename=$file" >> "$GITHUB_OUTPUT"
          ls -lh "$file"

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: goldraid-apk
          path: ${{ steps.apk.outputs.filename }}
          if-no-files-found: error
          retention-days: 30

      - name: Приложить APK к публичному релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: vova100324gg0/goldraid-downloads
          token: ${{ secrets.RELEASE_TOKEN }}
          name: "Золотой рейд ${{ github.ref_name }}"
          body: |
            **Золотой рейд ${{ github.ref_name }}**

            Android: APK · Windows: ZIP.

            Что нового в 1.4.0:
            - бесконечный режим: волны без конца и рекорд;
            - ежедневная карта: новая карта каждый день;
            - звуковые эффекты и переключатель «Звуки» в настройках;
            - отдельные рекорды для каждого режима;
            - мелкие исправления интерфейса.
          make_latest: true
          files: ${{ steps.apk.outputs.filename }}

  windows:
    name: Build Windows build
    runs-on: windows-latest
    needs: apk
    timeout-minutes: 90

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Собрать Windows-версию
        run: powershell -ExecutionPolicy Bypass -File build_windows.ps1 -Version 1.4.0 -NoVenv

      - name: Загрузить архив как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: goldraid-windows
          path: build/windows/goldraid-1.4.0-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Приложить архив к публичному релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: vova100324gg0/goldraid-downloads
          token: ${{ secrets.RELEASE_TOKEN }}
          name: "Золотой рейд ${{ github.ref_name }}"
          body: |
            **Золотой рейд ${{ github.ref_name }}**

            Android: APK · Windows: ZIP.

            Что нового в 1.4.0:
            - бесконечный режим: волны без конца и рекорд;
            - ежедневная карта: новая карта каждый день;
            - звуковые эффекты и переключатель «Звуки» в настройках;
            - отдельные рекорды для каждого режима;
            - мелкие исправления интерфейса.
          make_latest: true
          files: build/windows/goldraid-1.4.0-windows.zip