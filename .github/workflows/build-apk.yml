name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Собрать APK через Buildozer
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Показать результат
        run: |
          echo "APK: ${{ steps.buildozer.outputs.filename }}"
          ls -lh "${{ steps.buildozer.outputs.filename }}"

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: goldraid-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
          retention-days: 30

      - name: Приложить APK к релизу (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.buildozer.outputs.filename }}
          generate_release_notes: true